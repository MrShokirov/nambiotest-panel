<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark light">
  <title>Sokhibjon GYM</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function () { // theme before first paint — no white/black flash
      var m = 'auto'; try { m = localStorage.getItem('theme') || 'auto'; } catch (e) {}
      var dark = m === 'dark' || (m === 'auto' && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash"><img src="img/logo.svg" alt=""><b>Sokhibjon GYM</b></div>
  <main id="view" class="view"></main>
  <nav id="nav" class="nav" hidden></nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
