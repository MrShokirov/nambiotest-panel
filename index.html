<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NAM BIOTEST · Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="chart.umd.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e6e9ef;--accent:#1f6feb;--ok:#2ea043;--warn:#d29922;--bad:#cf222e;--chip:#eef3fd}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2c;--ink:#e6eaf2;--muted:#8d97ab;--line:#263045;--chip:#1c2a44}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 0}
h1{font-size:17px;margin:0 0 2px}.sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 13px;font-size:13px}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:0 14px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.card h2{font-size:14px;margin:0 0 8px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{display:block;font-size:17px;margin-top:2px}.kpi span{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,input{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px}
.list .it{border-top:1px solid var(--line);padding:9px 0}.list .it:first-child{border-top:0}
.it .t{font-weight:600}.it .m{color:var(--muted);font-size:12px;margin-top:2px}.it .r{display:flex;justify-content:space-between;gap:8px;margin-top:3px}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 8px;font-size:11px;margin-right:4px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent)}
canvas{max-width:100%}.empty{color:var(--muted);text-align:center;padding:24px 0}
#lock{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><h1>NAM BIOTEST · Birja paneli</h1><div class="sub" id="upd">Yuklanmoqda…</div>
<nav id="tabs"></nav></header>
<main id="app"><div id="lock">Maʼlumotlar yuklanmoqda…</div></main>
<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const $ = s => document.querySelector(s), app = $('#app');
const nf = n => Math.round(Number(n) || 0).toLocaleString('ru-RU').replace(/ /g, ' ');
const big = n => { n = Number(n) || 0; return n >= 1e9 ? (n / 1e9).toFixed(2).replace('.', ',') + ' mlrd' : n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' mln' : nf(n); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fd = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? '—' : `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`; };
const fdt = s => { if (!s) return '—'; const d = new Date(s); if (isNaN(d)) return '—'; const t = d.getHours() || d.getMinutes() ? ` ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : ''; return fd(s) + t; };
const ST = { new: ['🆕', 'Toʻlov kutilmoqda'], paid: ['🚚', 'Yetkazish kutilmoqda'], delivered: ['✅', 'Yetkazildi'], terminated: ['❌', 'Bekor'] };
let D = null, charts = [];
const COLORS = ['#1f6feb', '#2ea043', '#d29922', '#cf222e', '#8250df', '#1b7c83', '#bf3989', '#6e7781', '#fb8f44', '#57ab5a'];

function b64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decrypt(txt, keyB64) {
  const raw = b64(txt.trim()), iv = raw.slice(0, 12), data = raw.slice(12);
  const key = await crypto.subtle.importKey('raw', b64(keyB64), 'AES-GCM', false, ['decrypt']);
  let buf = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data));
  if (buf[0] === 0x1f && buf[1] === 0x8b && 'DecompressionStream' in window) buf = new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(buf));
}
async function load() {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  let k = q.get('k') || h.get('k'); try { if (k) localStorage.setItem('nbk', k); else k = localStorage.getItem('nbk'); } catch (e) {}
  if (!k) { app.innerHTML = '<div id="lock">🔐 Kalit topilmadi. Panelni botdagi «📱 Panel» tugmasi orqali oching.</div>'; return; }
  const parts = location.pathname.split('/').filter(Boolean), owner = location.hostname.split('.')[0], repo = parts[0] || 'nambiotest-panel';
  const urls = [`https://raw.githubusercontent.com/${owner}/${repo}/main/data.bin?t=${Date.now()}`, `data.bin?t=${Date.now()}`];
  for (const u of urls) { try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) { D = await decrypt(await r.text(), k); break; } } catch (e) {} }
  if (!D) { app.innerHTML = '<div id="lock">⚠️ Maʼlumotni ochib boʻlmadi. Botdan panelni qayta oching.</div>'; return; }
  $('#upd').textContent = 'Yangilangan: ' + new Date(D.t).toLocaleString('ru-RU').slice(0, 17);
  tabs();
}
const TABS = [['home', '📊 Umumiy'], ['deals', '📑 Shartnomalar'], ['cust', '🏥 Mijozlar'], ['market', '🛒 Bozor'], ['fc', '🔮 Bashorat'], ['fin', '💰 Moliya']];
let cur = 'home';
function tabs() {
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-k="${k}" class="${k === cur ? 'on' : ''}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.k; tabs(); });
  charts.forEach(c => c.destroy()); charts = [];
  ({ home, deals, cust, market, fc, fin })[cur]();
  window.scrollTo(0, 0);
}
function chart(id, cfg) { const el = document.getElementById(id); if (!el || !window.Chart) return; const ink = getComputedStyle(document.documentElement).getPropertyValue('--muted');
  Chart.defaults.color = ink.trim() || '#6b7385'; charts.push(new Chart(el, cfg)); }

function home() {
  const k = D.kpi;
  app.innerHTML = `<div class="kpis">
    <div class="kpi"><span>Shu oy savdo</span><b>${big(k.month)}</b><span>${k.monthN} ta shartnoma</span></div>
    <div class="kpi"><span>Yil boshidan</span><b>${big(k.year)}</b><span>${k.yearN} ta</span></div>
    <div class="kpi"><span>Kutilayotgan tushum</span><b>${big(k.unpaid + k.held)}</b><span>toʻlanmagan + birjada</span></div>
    <div class="kpi"><span>Muddati oʻtgan</span><b class="${k.late ? 'bad' : 'ok'}">${k.late} ta</b><span>yetkazish</span></div>
    <div class="kpi"><span>Takliflar (oy)</span><b>${k.won} / ${k.lost}</b><span>yutildi / boy berildi</span></div>
    <div class="kpi"><span>Boy berilgan (oy)</span><b class="warn">${big(k.missed)}</b><span>${k.missedN} ta lot</span></div></div>
    <div class="card"><h2>Oylik savdo</h2><canvas id="c1" height="190"></canvas></div>
    <div class="card"><h2>Mahsulot guruhlari (90 kun)</h2><canvas id="c2" height="220"></canvas></div>
    <div class="card"><h2>Hududlar (90 kun)</h2><canvas id="c3" height="${40 + D.regions.length * 26}"></canvas></div>`;
  chart('c1', { type: 'bar', data: { labels: D.months.map(m => m[0]), datasets: [{ data: D.months.map(m => m[1]), backgroundColor: '#1f6feb', borderRadius: 5 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => nf(c.raw) + " so'm" } } }, scales: { y: { ticks: { callback: v => big(v) } } } } });
  chart('c2', { type: 'doughnut', data: { labels: D.groups.map(g => g[0]), datasets: [{ data: D.groups.map(g => g[1]), backgroundColor: COLORS }] }, options: { plugins: { legend: { position: 'bottom' } } } });
  chart('c3', { type: 'bar', data: { labels: D.regions.map(r => r[0]), datasets: [{ data: D.regions.map(r => r[1]), backgroundColor: '#2ea043', borderRadius: 4 }] },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => big(v) } } } } });
}

function deals() {
  const regs = [...new Set(D.deals.map(r => r[5]))].sort(), grs = [...new Set(D.deals.map(r => r[7]).filter(Boolean))].sort();
  app.innerHTML = `<div class="card"><div class="row">
    <select id="fs"><option value="">Barcha holatlar</option><option value="act" selected>Faol (toʻlov/yetkazish)</option>${Object.entries(ST).map(([k, v]) => `<option value="${k}">${v[0]} ${v[1]}</option>`).join('')}<option value="late">🔴 Muddati oʻtgan</option></select>
    <select id="fr"><option value="">Barcha hududlar</option>${regs.map(r => `<option>${esc(r)}</option>`).join('')}</select></div>
    <div class="row"><select id="fg"><option value="">Barcha mahsulotlar</option>${grs.map(r => `<option>${esc(r)}</option>`).join('')}</select>
    <input id="fq" placeholder="Qidiruv: mijoz, №, mahsulot"></div><div class="sub" id="fsum"></div></div><div class="card list" id="dl"></div>`;
  const draw = () => {
    const s = $('#fs').value, rg = $('#fr').value, g = $('#fg').value, q = $('#fq').value.toLowerCase(), now = Date.now();
    const v = D.deals.filter(r => (!s || (s === 'act' ? (r[2] === 'new' || r[2] === 'paid') : s === 'late' ? (r[2] === 'paid' && r[10] && new Date(r[10]) < now) : r[2] === s))
      && (!rg || r[5] === rg) && (!g || r[7] === g) && (!q || (r[0] + ' ' + r[3] + ' ' + r[6]).toLowerCase().includes(q)));
    $('#fsum').textContent = `${v.length} ta · ${nf(v.reduce((a, r) => a + (r[2] === 'terminated' ? 0 : r[9]), 0))} soʻm`;
    $('#dl').innerHTML = v.slice(0, 200).map(r => { const late = r[2] === 'paid' && r[10] && new Date(r[10]) < now;
      return `<div class="it"><div class="r"><span class="t">№${r[0]} · ${esc(r[3])}</span><span>${ST[r[2]][0]}</span></div>
      <div class="m">${esc(r[6])} · ${nf(r[8])} dona · <b>${nf(r[9])}</b> soʻm</div>
      <div class="m">📍 ${esc(r[5])} · ${fd(r[1])}${(r[2] === 'new' || r[2] === 'paid') ? ` · ⏰ <span class="${late ? 'bad' : ''}">${fd(r[10])}</span>` : ''}</div>
      ${(r[2] === 'new' || r[2] === 'paid') ? `<div class="m">${r[11] === 2 ? `<span class="ok">📝 ishonchnoma bor — ${fdt(r[15])}</span>` : r[11] === 1 ? '<span class="bad">📝 ishonchnoma rad</span>' : '📝 ishonchnoma ⏳'} · 🧾 ${esc(r[12] || 'faktura yoʻq')}${r[13] ? ' · 👤 ' + esc(r[13]) : ''}${r[14] ? ' · 🚚 joʻnatildi' : ''}</div>` : ''}</div>`; }).join('') || '<div class="empty">Topilmadi</div>';
  };
  ['fs', 'fr', 'fg'].forEach(i => $('#' + i).onchange = draw); $('#fq').oninput = draw; draw();
}

function cust() {
  app.innerHTML = `<div class="card"><input id="cq" placeholder="Mijoz qidirish"></div><div class="card list" id="cl"></div>`;
  const draw = () => { const q = $('#cq').value.toLowerCase();
    $('#cl').innerHTML = D.customers.filter(c => !q || c.n.toLowerCase().includes(q) || c.tin.includes(q)).slice(0, 150).map(c => `<div class="it">
      <div class="t">${esc(c.n)}</div><div class="m">STIR ${esc(c.tin)} · ${esc(c.rg || '')} ${c.ms ? '· 👤 ' + esc(c.ms) : ''}</div>
      <div class="m">${c.k} ta shartnoma · <b>${big(c.s)}</b> soʻm · oxirgi ${fd(c.last)}${c.act ? ` · <span class="ok">faol ${c.act}</span>` : ''}</div>
      ${c.notes.map(n => `<div class="m">🗒 ${fd(n[0])} · ${esc(n[1])}: ${esc(n[2])}</div>`).join('')}
      ${c.rem.map(r => `<div class="m warn">⏰ ${fd(r[0])}: ${esc(r[1])}</div>`).join('')}</div>`).join('') || '<div class="empty">Topilmadi</div>'; };
  $('#cq').oninput = draw; draw();
}

function market() {
  const c = D.catalog;
  app.innerHTML = `<div class="card"><h2>Bozor ulushi (90 kun, ekspress-testlar)</h2><canvas id="m1" height="230"></canvas></div>
    <div class="card list"><h2>Katalog: narx reytingi</h2>${c.groups.map(g => `<div class="it"><div class="r"><span class="t">${esc(g[0])}</span><span>${g[2] ? `<b>${g[2]}</b>/${g[3]}-oʻrin` : '<span class="mut">eʼlonimiz yoʻq</span>'}</span></div>
      <div class="m">🟢 biz: ${g[1] ? nf(g[1]) : '—'} · ⚔️ eng arzon: ${g[4] ? nf(g[4]) + ' (' + esc(g[5]) + ')' : '—'}</div>
      <div class="m">raqobatchi eʼlonlari ${g[6]} · diler ${g[7]} · raqobatchilar 7 kunda ~${nf(g[8])} dona sotdi</div></div>`).join('') || '<div class="empty">Hali yuklanmagan</div>'}</div>
    <div class="card list"><h2>🤝 Diler eʼlonlari (bizning Pharm ID)</h2>${c.dealers.map(o => `<div class="it"><div class="t ${o[5] ? 'bad' : ''}">${o[5] ? '⚠️ ' : ''}${esc(o[0])}</div>
      <div class="m"><b>${nf(o[1])}</b> soʻm${o[4] ? ' (prays ' + nf(o[4]) + ')' : ''} · qoldiq ${nf(o[2])}/${nf(o[3])} · eʼlon ${esc(o[6])}</div></div>`).join('') || '<div class="empty">Yoʻq</div>'}</div>
    <div class="card list"><h2>📢 Bizning eʼlonlar qoldigʻi</h2>${D.offers.map(o => `<div class="it"><div class="r"><span class="t">${esc(o[0])}</span><span>${o[5]}</span></div>
      <div class="bar"><i style="width:${o[2] ? Math.min(100, o[1] / o[2] * 100) : 0}%"></i></div><div class="m">${nf(o[1])} / ${nf(o[2])} · ${nf(o[3])} soʻm · ${fd(o[4])} gacha</div></div>`).join('') || '<div class="empty">Yoʻq</div>'}</div>
    <div class="card list"><h2>📉 Boy berilgan lotlar (30 kun)</h2>${D.missed.map(m => `<div class="it"><div class="t">${m[7] ? '🥈' : '🙈'} ${esc(m[2])}</div>
      <div class="m">🏆 ${esc(m[3])} · ${nf(m[4])} × ${nf(m[5])} = <b>${big(m[6])}</b> · ${fd(m[0])}</div></div>`).join('') || '<div class="empty">Yoʻq</div>'}</div>`;
  chart('m1', { type: 'doughnut', data: { labels: D.share.map(s => s[0]), datasets: [{ data: D.share.map(s => s[1]), backgroundColor: COLORS }] }, options: { plugins: { legend: { position: 'bottom' } } } });
}

function fc() {
  app.innerHTML = `<div class="card"><h2>🏭 Keyingi oy ishlab chiqarish (dona)</h2><canvas id="f1" height="230"></canvas></div>
    <div class="card list"><h2>🔮 Takroriy xarid kutilmoqda (3 hafta)</h2>${D.forecast.map(f => `<div class="it"><div class="r"><span class="t">${fd(f[0])}</span><span class="${f[1] < 0 ? 'bad' : f[1] <= 5 ? 'warn' : 'mut'}">${f[1] >= 0 ? f[1] + ' kun' : Math.abs(f[1]) + ' kun oʻtdi'}</span></div>
      <div class="m">🏥 ${esc(f[2])} · ${esc(f[3])}</div><div class="m">🧪 ${esc(f[4])} · ~${nf(f[5])} dona · har ${f[6]} kunda · oxirgi: ${f[7] === 'NAM BIOTEST' ? '<span class="ok">biz</span>' : '⚔️ ' + esc(f[7])} · ${esc(f[8])}</div></div>`).join('') || '<div class="empty">Hozircha yoʻq</div>'}</div>`;
  chart('f1', { type: 'bar', data: { labels: D.prod.map(p => p[0]), datasets: [{ label: 'Oxirgi oy', data: D.prod.map(p => p[3]), backgroundColor: '#9db7e8' }, { label: 'Prognoz', data: D.prod.map(p => p[4]), backgroundColor: '#1f6feb' }, { label: 'Tavsiya', data: D.prod.map(p => p[5]), backgroundColor: '#2ea043' }] },
    options: { plugins: { legend: { position: 'bottom' } } } });
}

function fin() {
  const f = D.fin;
  app.innerHTML = `<div class="kpis">
    <div class="kpi"><span>🏦 Hisob raqam</span><b>${f.bal != null ? big(f.bal) : '—'}</b><span>${f.balT ? fd(f.balT) : '/balans bilan kiriting'}</span></div>
    <div class="kpi"><span>🆕 Mijoz toʻlamagan</span><b>${big(f.unpaid)}</b><span>${f.unpaidN} ta</span></div>
    <div class="kpi"><span>🔒 Birjada</span><b>${big(f.held)}</b><span>${f.heldN} ta · yetkazilgach</span></div>
    <div class="kpi"><span>🧷 Garovda</span><b>${big(f.pledge)}</b><span>3%</span></div>
    <div class="kpi"><span>🔴 Muddati oʻtgan</span><b class="bad">${big(f.late)}</b><span>${f.lateN} ta</span></div>
    <div class="kpi"><span>💸 Komissiya (oy)</span><b>${big(f.com)}</b><span>birja</span></div></div>
    <div class="card"><h2>Pul tarkibi</h2><canvas id="p1" height="220"></canvas></div>
    <div class="card list"><h2>⏰ Eslatmalar</h2>${D.reminders.map(r => `<div class="it"><div class="t">${fd(r[0])} · ${esc(r[1])}</div><div class="m">${esc(r[2])} · ${esc(r[3])}</div></div>`).join('') || '<div class="empty">Yoʻq</div>'}</div>`;
  chart('p1', { type: 'doughnut', data: { labels: ['Toʻlanmagan', 'Birjada', 'Garovda'], datasets: [{ data: [f.unpaid, f.held, f.pledge], backgroundColor: ['#d29922', '#1f6feb', '#8250df'] }] }, options: { plugins: { legend: { position: 'bottom' } } } });
}
load();
</script>
</body>
</html>
